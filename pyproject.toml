[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav_sdk"
version = "0.1.0"
description = "UAV MAVLink SDK"
authors = [{name = "Manikanth"}]
dependencies = ["pymavlink"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]